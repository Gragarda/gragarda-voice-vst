Calibrate="🎙 Έναρξη βαθμονόμησης"
CalibTitle="Gragarda Voice — βαθμονόμηση"
CalibIntro="<p>Ο οδηγός ακούει το μικρόφωνό σου <b>όπως είναι</b> και ρυθμίζει για σένα την ενίσχυση και τις 4 μακροεντολές.</p><p>1. <b>5 δευτερόλεπτα σιωπή</b>: μη μιλάς, άφησε τα πάντα όπως σε ζωντανή μετάδοση (ανεμιστήρες, PC ανοιχτό). Μετριέται ο θόρυβος υποβάθρου.<br>2. <b>15 δευτερόλεπτα ανάγνωση</b>: διάβασε ένα κείμενο με κανονική φωνή, στη συνηθισμένη απόσταση από το μικρόφωνο.</p><p>Τίποτα δεν αλλάζει μέχρι να πατήσεις <b>Εφαρμογή</b>.</p>"
CalibStart="Έναρξη"
CalibCancel="Ακύρωση"
CalibNoise="<h3>Σιωπή… 🤫</h3><p>Μη μιλάς για 5 δευτερόλεπτα.</p>"
CalibSpeech="<h3>Διάβασε αυτό το κείμενο με κανονική φωνή 🎙</h3><p style='font-size:15px; line-height:150%'>«Έξι σιωπηλές αδελφές πέρασαν μέσα από το σκιερό δάσος, κάθισαν δίπλα σε μια δροσερή πηγή και μοιράστηκαν ψωμί, τυρί και γλυκό χυμό. — Είναι σπουδαίο, ψιθύρισε η μικρότερη χαμογελώντας. Ξαφνικά, ένας υπόκωφος ήχος αντήχησε στο βάθος…»</p>"
CalibNoAudio="⚠ Δεν λαμβάνεται ήχος: έλεγξε ότι το μικρόφωνο δεν είναι σε σίγαση και ότι το φίλτρο είναι ενεργό."
CalibInvalid="<p>Ανιχνεύθηκε πολύ λίγη φωνή κατά την ανάγνωση. Έλεγξε το μικρόφωνο και δοκίμασε ξανά με κανονική φωνή.</p>"
