CalibIntro="<p>Der Assistent hört dein Mikrofon <b>so wie es ist</b> und stellt Verstärkung und die 4 Makros für dich ein.</p><p>1. <b>5 Sekunden Stille</b>: nicht sprechen, alles wie im Live-Betrieb lassen (Lüfter, PC an). Das Grundrauschen wird gemessen.<br>2. <b>15 Sekunden Vorlesen</b>: einen Text mit normaler Stimme und üblichem Abstand zum Mikrofon vorlesen.</p><p>Nichts ändert sich, bis du auf <b>Übernehmen</b> klickst.</p>"
