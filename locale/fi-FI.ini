CalibIntro="<p>Ohjattu toiminto kuuntelee mikrofoniasi <b>sellaisenaan</b> ja säätää vahvistuksen sekä 4 makroa puolestasi.</p><p>1. <b>5 sekuntia hiljaisuutta</b>: älä puhu, pidä kaikki kuten lähetyksessä (tuulettimet, PC päällä). Taustakohina mitataan.<br>2. <b>15 sekuntia lukemista</b>: lue teksti normaalilla äänellä, tavallisella etäisyydellä mikrofonista.</p><p>Mikään ei muutu ennen kuin napsautat <b>Käytä</b>.</p>"
