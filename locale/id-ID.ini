CalibIntro="<p>Asisten mendengarkan mikrofonmu <b>apa adanya</b> untuk mengatur penguatan dan 4 makro untukmu.</p><p>1. <b>5 detik hening</b>: jangan bicara, biarkan semuanya seperti saat siaran (kipas, PC menyala). Derau latar diukur.<br>2. <b>15 detik membaca</b>: bacakan teks dengan suara normal, pada jarak biasa dari mikrofon.</p><p>Tidak ada yang berubah sampai kamu mengklik <b>Terapkan</b>.</p>"
