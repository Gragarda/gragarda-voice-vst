CalibIntro="<p>L'assistente ascolta il tuo microfono <b>così com'è</b> per regolare il guadagno e le 4 macro al posto tuo.</p><p>1. <b>5 secondi di silenzio</b>: non parlare, resta come in diretta (ventole, PC acceso). Viene misurato il rumore di fondo.<br>2. <b>15 secondi di lettura</b>: leggi un testo con voce normale, alla tua solita distanza dal microfono.</p><p>Non cambia nulla finché non fai clic su <b>Applica</b>.</p>"
CalibStart="Inizia"
