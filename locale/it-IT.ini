CalibNoise="<h3>Silenzio… 🤫</h3><p>Non parlare per 5 secondi.</p>"
CalibSpeech="<h3>Leggi questo testo con voce normale 🎙</h3><p style='font-size:15px; line-height:150%'>«Sei sorelle silenziose scesero sul sentiero sassoso e si sedettero sotto un salice, accanto a una sorgente fresca. Spezzarono il pane, assaggiarono il formaggio e sorseggiarono succo di pesca. — È splendido, sussurrò la più giovane sorridendo. Poi, d'improvviso, un suono sordo risuonò in lontananza…»</p>"
