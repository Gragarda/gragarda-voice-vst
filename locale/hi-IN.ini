CalibIntro="<p>सहायक आपके माइक को <b>जैसा है वैसा</b> सुनकर आपके लिए गेन और 4 मैक्रो सेट करता है।</p><p>1. <b>5 सेकंड की चुप्पी</b>: बोलें नहीं, सब कुछ लाइव जैसा रहने दें (पंखे, पीसी चालू)। पृष्ठभूमि शोर मापा जाता है।<br>2. <b>15 सेकंड पढ़ना</b>: सामान्य आवाज़ में, माइक से अपनी सामान्य दूरी पर एक पाठ पढ़ें।</p><p>जब तक आप <b>लागू करें</b> पर क्लिक नहीं करते, कुछ नहीं बदलता।</p>"
