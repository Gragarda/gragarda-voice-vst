CalibSpeech="<h3>Przeczytaj ten tekst normalnym głosem 🎙</h3><p style='font-size:15px; line-height:150%'>„W Szczebrzeszynie chrząszcz brzmi w trzcinie, a sześć sióstr siedzi przy strumieniu i słucha szumu sosen. Potem szły ścieżką przez cichy las, usiadły przy świeżym źródle i podzieliły się chlebem, serem i sokiem z wiśni. — Jak tu ślicznie, szepnęła najmłodsza z uśmiechem. Nagle z oddali dobiegł głuchy dźwięk…”</p>"
