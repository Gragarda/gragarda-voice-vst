CalibIntro="<p>Asystent słucha twojego mikrofonu <b>takiego, jaki jest</b>, i sam ustawia wzmocnienie oraz 4 makra.</p><p>1. <b>5 sekund ciszy</b>: nie mów, zostaw wszystko jak podczas transmisji (wentylatory, włączony PC). Mierzony jest szum tła.<br>2. <b>15 sekund czytania</b>: przeczytaj tekst normalnym głosem, w zwykłej odległości od mikrofonu.</p><p>Nic się nie zmieni, dopóki nie klikniesz <b>Zastosuj</b>.</p>"
