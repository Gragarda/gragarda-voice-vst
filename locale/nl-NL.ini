CalibIntro="<p>De assistent luistert naar je microfoon <b>zoals hij is</b> en stelt de versterking en de 4 macro's voor je in.</p><p>1. <b>5 seconden stilte</b>: niet praten, alles zoals tijdens een live (ventilatoren, pc aan). De achtergrondruis wordt gemeten.<br>2. <b>15 seconden voorlezen</b>: lees een tekst voor met normale stem, op je gebruikelijke afstand van de microfoon.</p><p>Er verandert niets tot je op <b>Toepassen</b> klikt.</p>"
CalibStart="Starten"
CalibCancel="Annuleren"
CalibNoise="<h3>Stilte… 🤫</h3><p>Praat 5 seconden niet.</p>"
CalibSpeech="<h3>Lees deze tekst voor met normale stem 🎙</h3><p style='font-size:15px; line-height:150%'>„Zes slimme zussen zaten stil aan de zee en staarden zwijgend naar de zon. Later wandelden ze door het schaduwrijke bos, zetten zich bij een frisse bron en deelden brood, zachte kaas en zoet sap. — Wat is dit schitterend, fluisterde de jongste glimlachend. Plotseling klonk er in de verte een dof geluid…”</p>"
CalibNoAudio="⚠ Geen audio ontvangen: controleer of de microfoon niet gedempt is en het filter aan staat."
