CalibSpeech="<h3>평소 목소리로 이 글을 읽어 주세요 🎙</h3><p style='font-size:15px; line-height:150%'>“상쾌한 아침, 세 사람이 숲속 산길을 지나 시원한 샘물 옆에 앉았습니다. 신선한 빵과 치즈를 나누고 새콤한 주스를 조금씩 마셨습니다. — 정말 최고야, 막내가 속삭이며 미소 지었습니다. 그때 갑자기 멀리서 낮은 소리가 울려 퍼졌습니다…”</p>"
CalibNoAudio="⚠ 소리가 들어오지 않습니다: 마이크가 음소거되지 않았는지, 필터가 켜져 있는지 확인하세요."
