CalibIntro="<p>도우미가 마이크를 <b>있는 그대로</b> 듣고 게인과 4개의 매크로를 대신 설정합니다.</p><p>1. <b>5초간 무음</b>: 말하지 말고 방송할 때와 같은 상태를 유지하세요 (팬, PC 켜짐). 배경 소음을 측정합니다.<br>2. <b>15초간 읽기</b>: 평소 목소리로, 평소 마이크 거리에서 글을 읽으세요.</p><p><b>적용</b>을 누르기 전에는 아무것도 바뀌지 않습니다.</p>"
