CalibIntro="<p>El asistente escucha tu micrófono <b>tal cual</b> para ajustar la ganancia y las 4 macros por ti.</p><p>1. <b>5 segundos de silencio</b>: no hables, quédate como en directo (ventiladores, PC encendido). Se mide el ruido de fondo.<br>2. <b>15 segundos de lectura</b>: lee un texto con voz normal, a tu distancia habitual del micrófono.</p><p>Nada cambia hasta que pulses <b>Aplicar</b>.</p>"
