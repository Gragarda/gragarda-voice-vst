CalibSpeech="<h3>Lee este texto con voz normal 🎙</h3><p style='font-size:15px; line-height:150%'>«Seis sastres sabios salieron temprano, subieron la sierra silenciosa y se sentaron junto a un arroyo fresco. Sacaron su pan, su queso y una botella de zumo de cerezas. — Esto es precioso, susurró el más joven sonriendo. De pronto, un sonido sordo resonó a lo lejos…»</p>"
