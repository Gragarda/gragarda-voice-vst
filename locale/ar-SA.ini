CalibNoise="<h3>صمت… 🤫</h3><p>لا تتكلم لمدة 5 ثوانٍ.</p>"
CalibSpeech="<h3>اقرأ هذا النص بصوتك العادي 🎙</h3><p style='font-size:15px; line-height:150%'>«في صباحٍ مشمس، سار ستة أصدقاء عبر غابةٍ ساكنة، ثم جلسوا بجانب نبعٍ صافٍ يتقاسمون الخبز والجبن وعصير المشمش الشهي. — هذا سحريّ، همس أصغرهم مبتسمًا. وفجأةً، تردّد صوتٌ عميق من بعيد…»</p>"
