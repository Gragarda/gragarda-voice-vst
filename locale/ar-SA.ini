CalibTitle="Gragarda Voice — المعايرة"
CalibIntro="<p>يستمع المساعد إلى الميكروفون <b>كما هو</b> لضبط الكسب والماكروهات الأربعة نيابةً عنك.</p><p>1. <b>5 ثوانٍ من الصمت</b>: لا تتكلم، واترك كل شيء كما في البث (المراوح والحاسوب تعمل). يتم قياس ضوضاء الخلفية.<br>2. <b>15 ثانية من القراءة</b>: اقرأ نصًا بصوتك العادي وعلى مسافتك المعتادة من الميكروفون.</p><p>لن يتغير شيء حتى تضغط <b>تطبيق</b>.</p>"
