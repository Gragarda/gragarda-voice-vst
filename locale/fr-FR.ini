Help="? Aide"
HelpAudioSettings="Réglages audio (micro, sortie)"
HelpStandalone="Mise en route<br><br>1. Clique sur « Réglages audio » ci-dessous. Entrée : ton micro. Sortie : « CABLE Input » (VB-Cable) pour utiliser ta voix traitée dans d'autres logiciels, ou ton casque pour t'écouter. Choisis 48 kHz si possible.<br>2. Dans Discord, OBS, Teams, Zoom... : choisis « CABLE Output » comme micro.<br>3. Clique sur « Lancer la calibration » et suis les étapes : elle règle le gain et le son selon ton micro et ta pièce.<br>4. Ajuste avec les 4 macros (50 = son de référence) et choisis une destination (Stream, Podcast, Voix off).<br><br>Pas de son ?<br>- Vérifie que l'entrée est bien ton micro et que « Mute audio input » est désactivé dans les réglages audio.<br>- Micro d'un seul côté : Options avancées > Canaux du micro > Mono (gauche) ou Mono (droite).<br>- Pas de « CABLE Input » : installe VB-Cable (vb-audio.com/Cable), redémarre, puis choisis-le dans les réglages audio.<br><br>Avant/après compare la voix brute et traitée au même niveau. Tes réglages sont enregistrés automatiquement."
HelpPlugin="Mise en route<br><br>1. Place Gragarda Voice sur la piste ou l'entrée de ton micro, en premier dans la chaîne. Projet en 48 kHz si possible.<br>2. Clique sur « Lancer la calibration » pendant que la piste reçoit ton micro, et suis les étapes : elle règle le gain et le son selon ton micro et ta pièce.<br>3. Ajuste avec les 4 macros (50 = son de référence) et choisis une destination (Stream, Podcast, Voix off).<br><br>Pas de son ou signal faible ?<br>- Vérifie que la piste est armée ou en écoute et reçoit bien ton micro.<br>- Micro d'un seul côté : Options avancées > Canaux du micro > Mono (gauche) ou Mono (droite).<br><br>La latence est signalée à l'hôte et compensée automatiquement. Dans les outils en direct (Wave Link, Voicemeeter), décale ta vidéo d'autant si la synchro labiale compte. Les réglages sont enregistrés avec ton projet."
