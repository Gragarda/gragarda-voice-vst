CalibTitle="Gragarda Voice — calibration"
CalibIntro="<p>L'assistant écoute ton micro <b>tel quel</b> pour régler le gain et les 4 macros à ta place.</p><p>1. <b>5 secondes de silence</b> : ne parle pas, reste comme en live (ventilo, PC allumés). On mesure le bruit de fond.<br>2. <b>15 secondes de lecture</b> : lis un texte à voix normale, à ta distance habituelle du micro.</p><p>Rien n'est modifié avant que tu cliques sur <b>Appliquer</b>.</p>"
CalibStart="Commencer"
CalibCancel="Annuler"
CalibNoise="<h3>Silence… 🤫</h3><p>Ne parle pas pendant 5 secondes.</p>"
CalibSpeech="<h3>Lis ce texte à voix normale 🎙</h3><p style='font-size:15px; line-height:150%'>« Ce matin, six chasseurs sachant chasser sans leur chien sont sortis sous un ciel gris. Ils ont traversé la forêt silencieuse, puis se sont assis près d'une source pour partager du pain, du fromage et une bouteille d'eau fraîche. — C'est parfait, a soufflé le plus jeune en souriant. Puis, soudain, un bruit sourd a résonné au loin… »</p>"
