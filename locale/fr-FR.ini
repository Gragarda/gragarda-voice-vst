CalibIntro="<p>L'assistant écoute ton micro <b>tel quel</b> pour régler le gain et les 4 macros à ta place.</p><p>1. <b>5 secondes de silence</b> : ne parle pas, reste comme en live (ventilo, PC allumés). On mesure le bruit de fond.<br>2. <b>15 secondes de lecture</b> : lis un texte à voix normale, à ta distance habituelle du micro.</p><p>Rien n'est modifié avant que tu cliques sur <b>Appliquer</b>.</p>"
