CalibTitle="Gragarda Voice — 校正"
CalibIntro="<p>精靈會<b>依原樣</b>聆聽你的麥克風，並自動設定增益與 4 個巨集。</p><p>1. <b>5 秒靜音</b>：不要說話，保持直播時的狀態（風扇、電腦開著）。將測量背景噪音。<br>2. <b>15 秒朗讀</b>：以正常音量、在平常與麥克風的距離朗讀一段文字。</p><p>按下<b>套用</b>前不會做任何變更。</p>"
CalibStart="開始"
CalibCancel="取消"
CalibNoise="<h3>請保持安靜… 🤫</h3><p>5 秒內不要說話。</p>"
CalibSpeech="<h3>請以正常音量朗讀這段文字 🎙</h3><p style='font-size:15px; line-height:150%'>「四是四，十是十，十四是十四，四十是四十。清晨，三個朋友穿過安靜的森林，坐在清澈的山泉旁，分享新鮮的麵包、起司和酸甜的果汁。— 真是太舒服了，最小的那個笑著輕聲說。突然，遠處傳來一聲低沉的聲響……」</p>"
CalibNoAudio="⚠ 沒有收到音訊：請檢查麥克風是否靜音，以及濾鏡是否已啟用。"
CalibInvalid="<p>朗讀時偵測到的人聲不足。請檢查麥克風，並以正常音量重試。</p>"
