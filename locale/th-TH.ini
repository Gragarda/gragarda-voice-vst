CalibIntro="<p>ตัวช่วยจะฟังไมค์ของคุณ<b>ตามสภาพจริง</b> เพื่อตั้งค่าเกนและมาโครทั้ง 4 ให้คุณ</p><p>1. <b>เงียบ 5 วินาที</b>: อย่าพูด ปล่อยทุกอย่างเหมือนตอนไลฟ์ (พัดลม คอมเปิดอยู่) ระบบจะวัดเสียงรบกวนพื้นหลัง<br>2. <b>อ่าน 15 วินาที</b>: อ่านข้อความด้วยเสียงปกติ ในระยะห่างจากไมค์ตามปกติ</p><p>จะไม่มีอะไรเปลี่ยนจนกว่าคุณจะกด<b>นำไปใช้</b></p>"
