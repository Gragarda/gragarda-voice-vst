CalibSpeech="<h3>Read this text at normal voice 🎙</h3><p style='font-size:15px; line-height:150%'>“She sells sea shells by the sea shore, and the shells she sells are surely seashells. This morning, six sharp friends crossed the silent forest, then sat by a spring to share bread, cheese and a fresh bottle of water. — That's perfect, whispered the youngest, smiling. Then suddenly, a deep sound echoed far away…”</p>"
