CalibTitle="Gragarda Voice — calibration"
CalibIntro="<p>The wizard listens to your mic <b>as is</b> to set the gain and the 4 macros for you.</p><p>1. <b>5 seconds of silence</b>: don't speak, stay as when live (fans, PC on). Background noise is measured.<br>2. <b>15 seconds of reading</b>: read a text at normal voice, at your usual distance from the mic.</p><p>Nothing changes until you click <b>Apply</b>.</p>"
