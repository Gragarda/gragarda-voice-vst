CalibTitle="Gragarda Voice — hiệu chỉnh"
CalibIntro="<p>Trợ lý sẽ nghe micro của bạn <b>nguyên trạng</b> để tự đặt độ khuếch đại và 4 macro.</p><p>1. <b>5 giây im lặng</b>: đừng nói, giữ mọi thứ như khi phát trực tiếp (quạt, máy tính bật). Tiếng ồn nền sẽ được đo.<br>2. <b>15 giây đọc</b>: đọc một đoạn văn bằng giọng bình thường, ở khoảng cách quen thuộc với micro.</p><p>Không có gì thay đổi cho đến khi bạn nhấn <b>Áp dụng</b>.</p>"
