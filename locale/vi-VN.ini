CalibCancel="Hủy"
CalibNoise="<h3>Im lặng… 🤫</h3><p>Đừng nói trong 5 giây.</p>"
CalibSpeech="<h3>Hãy đọc đoạn văn này bằng giọng bình thường 🎙</h3><p style='font-size:15px; line-height:150%'>“Sáng sớm, sáu người bạn đi xuyên qua khu rừng sâu và yên tĩnh, rồi ngồi xuống bên dòng suối trong xanh để chia sẻ bánh mì, phô mai và nước sấu mát lạnh. — Thật sảng khoái, cô bé nhỏ nhất thì thầm và mỉm cười. Bỗng nhiên, một âm thanh trầm vang vọng từ xa…”</p>"
CalibNoAudio="⚠ Không nhận được âm thanh: hãy kiểm tra micro không bị tắt tiếng và bộ lọc đang bật."
CalibInvalid="<p>Phát hiện quá ít giọng nói khi đọc. Hãy kiểm tra micro và thử lại bằng giọng bình thường.</p>"
